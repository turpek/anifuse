[project]
name = "anifuse"
version = "0.1.0"
description = "Motor inteligente para detecção e fusão de cenas panorâmicas de animes"
readme = "README.md"
authors = [
    { name = "Guilherme Teixeira de Faria", email = "gui.faria.96@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anicrop",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "loguru>=0.7.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[tool.uv.sources]
anicrop = { git = "https://github.com/turpek/anicrop.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anifuse"]
