[project]
name = "anifuse"
version = "0.1.0"
description = "Motor inteligente para detecção e fusão de cenas panorâmicas de animes"
readme = "README.md"
authors = [
    { name = "Guilherme Teixeira de Faria", email = "gui.faria.96@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anicrop",
    "loguru>=0.7.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pillow>=12.3.0",
    "typer>=0.27.2",
]

[project.scripts]
anifuse = "anifuse.cli:app"

[tool.uv.sources]
anicrop = { git = "https://github.com/turpek/anicrop.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["scripts", "scratch", ".venv"]
markers = [
    "slow: marca testes pesados ou demorados (desselecione com '-m \"not slow\"')",
]

[tool.ruff]
line-length = 89
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
extend-select = ["PLC0415"]
ignore = ["E501", "E741"]

[tool.autopep8]
max_line_length = 89

[tool.hatch.build.targets.wheel]
packages = ["src/anifuse"]
